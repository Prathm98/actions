name: Refresh Token Insta

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          ref: insta

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate Token
        uses: actions/github-script@v6
        env:
          INSTA_SECRETE: ${{secrets.INSTA_SECRETE }}
        with:
          script: |
            const axios = require('axios')
            const fs = require('fs')

            async function refreshInstagramToken(longLivedToken) {
              const url = `https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${longLivedToken}`
              const { data } = await axios.get(url)
              console.log('✅ Refreshed token:')
              console.log('Expires in:', data.expires_in, 'seconds')
              if(data.access_token){
                fs.writeFileSync('token.txt', data.access_token)
              }
            }

            const ACCESS_TOKEN = process.env.INSTA_SECRETE
            refreshInstagramToken(ACCESS_TOKEN)

      - name: Update Token
        env:
          GIT_PAT: ${{secrets.GIT_PAT }}
        run: |
          echo "${{ secrets.GIT_PAT }}" | gh auth login --with-token

          cat token.txt | gh secret set INSTA_SECRETE
